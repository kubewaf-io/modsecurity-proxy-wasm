# Integration stack for modsecurity-proxy-wasm — MUST use envoy.wasm.runtime.v8 (see test/fixtures/envoy.yaml).
version: "3.8"
services:
  envoy:
    image: ${ENVOY_IMAGE:-envoyproxy/envoy:v1.40-latest@sha256:459f2a6404c340fe6afccd69d85527012d47f3c036765493e6f8f3113fa384de}
    command: ["envoy", "-c", "/etc/envoy.yaml", "--log-level", "warn"]
    ports:
      - "18080:8080"
      - "19901:9901"
    volumes:
      - ./dist/modsecurity-proxy-wasm.wasm:/etc/modsecurity-proxy-wasm.wasm:ro
      - ./test/fixtures/envoy.yaml:/etc/envoy.yaml:ro