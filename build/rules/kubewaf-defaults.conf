# kubeWAF production baseline (virtual path: Include @kubewaf-defaults)
# Applied first by the operator for every WAF using modsecurity-proxy-wasm.
# Safe defaults for body inspection without demo/test rules.

SecTmpDir /modsecurity-proxy-wasm-rules
SecDataDir /modsecurity-proxy-wasm-rules

# Request body inspection (CRS request body rules + custom body SecRules).
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyLimitAction ProcessPartial
SecRequestBodyNoFilesLimit 131072
SecRequestBodyJsonDepthLimit 512

# Enable body parsers (from modsecurity.conf-recommended). Without these, CRS
# rules that inspect ARGS from JSON/XML never see parsed fields (e.g. 941210).
SecRule REQUEST_HEADERS:Content-Type "^(?:application(?:/soap\+|/)|text/)xml" \
    "id:200000,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"
SecRule REQUEST_HEADERS:Content-Type "^application/json" \
    "id:200001,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"

# Response body inspection (CRS RESPONSE-95x data-leakage rules, phase 4).
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html text/xml application/json
SecResponseBodyLimit 524288
SecResponseBodyLimitAction ProcessPartial

# Audit engine off in wasm (no durable audit filesystem); use structured logs + metrics.
SecAuditEngine Off
