---
logfile: '/home/envoy/logs/envoy.log'
logmarkerheadername: X-CRS-Test
# Keep in sync with FTW_MAX_MARKER_RETRIES default in tests.sh / docker-compose
# (CLI --max-marker-retries overrides this when set).
maxmarkerretries: 40
mode: default
testoverride:
  input:
    dest_addr: envoy
    port: 8080
  ignore:
    # Envoy rejects or normalizes these before the wasm filter runs.
    '911100-5': 'Invalid HTTP method. Rejected by Envoy with Error 400'
    '911100-7': 'Invalid HTTP method. Rejected by Envoy with Error 400'
    '920100-4': 'Accepted by Envoy. Valid request. Disabled by default on Apache/Nginx only'
    '920100-10': 'Invalid HTTP method. Rejected by Envoy with Error 400'
    '920100-14': 'Invalid HTTP method. Rejected by Envoy with Error 400'
    '920100-16': 'Invalid HTTP request line. Rejected by Envoy with Error 400'
    '920181-1': 'Content-Length + Transfer-Encoding rejected by Envoy with Error 400'
    '920210-2': 'Connection header stripped by Envoy'
    '920210-3': 'Connection header stripped by Envoy'
    '920210-4': 'Connection header stripped by Envoy'
    '920210-6': 'Connection header stripped by Envoy'
    '920210-7': 'Connection header stripped by Envoy'
    '920274-2': 'Envoy populates :path; PL4 invalid-character false positives'
    '920274-3': 'Envoy populates :path; PL4 invalid-character false positives'
    '920274-5': 'Envoy populates :path; PL4 invalid-character false positives'
    '932161-7': 'Referer header sanitized by Envoy'
    '932161-9': 'Referer header sanitized by Envoy'
    '932161-10': 'Referer header sanitized by Envoy'
    '932161-11': 'Referer header sanitized by Envoy'
    '932161-12': 'Referer header sanitized by Envoy'
    '932237-8': 'Referer header sanitized by Envoy'
    '932237-18': 'Referer header sanitized by Envoy'
    '932239-6': 'Referer header sanitized by Envoy'
    '932239-7': 'Referer header sanitized by Envoy'
    '932239-19': 'Referer header sanitized by Envoy'
    '932239-27': 'Referer header sanitized by Envoy'
    '932239-29': 'Referer header sanitized by Envoy'
    '941101-1': 'Referer header sanitized by Envoy'
    '941110-4': 'Referer header sanitized by Envoy'
    # XSS in Referer — same Envoy Referer sanitization as 941101-1 / 941110-4.
    # (Envoy strips/normalizes Referer before the Wasm filter; not fixable in-plugin.)
    '941120-49': 'Referer header sanitized by Envoy (onclick XSS payload)'
    '941120-50': 'Referer header sanitized by Envoy (onmouseover XSS payload)'
    # --- CI XSS subset (^941.*): remaining PL2 gaps after path-normalization work ---
    # 941101: libinjection on REQUEST_FILENAME; sibling PL1 rules often fire (941120/160/390)
    # but @detectXSS does not. Not an Envoy path issue (raw :path is preserved).
    '941101-2': 'libinjection @detectXSS misses path quote XSS; PL1 siblings may still fire'
    '941101-3': 'libinjection @detectXSS misses %3Csvg path XSS; PL1 siblings fire instead'
    '941150-1': 'PL2 HTML attr filter; percent-encoded form body edge case'
    '941150-2': 'PL2 HTML attr filter; JScript.Encode cheatsheet payload'
    '941181-1': 'PL2 node-validator --> in ARGS'
    '941181-2': 'PL2 node-validator --%3E in ARGS'
    '941181-3': 'PL2 node-validator --> in ARGS_NAMES'
    '941181-4': 'PL2 node-validator --> in Cookie'
    '941320-1': 'PL2 HTML tag handler <noscript#'
    '941330-1': 'PL2 IE XSS filter unicode escapes in query'
    '941330-2': 'PL2 IE XSS filter iframe srcdoc'
    '941340-1': 'PL2 IE XSS filter infoo.bar'
    '941340-2': 'PL2 IE XSS filter JScript.Encode'
    '941380-1': 'PL2 AngularJS {{}} ARGS match after url-decode; engine gap'
    # Multipart FILES_NAMES special-char filenames (no writable upload FS in wasm;
    # extract path not required but disposition/filename parsing still incomplete).
    '920121-1': 'Multipart FILES; filename with semicolon — wasm multipart gap'
    '920121-2': "Multipart FILES; filename with quote — wasm multipart gap"
    '920121-3': 'Multipart FILES; filename with escaped quote — wasm multipart gap'
    '920121-4': 'Multipart FILES; filename with equals — wasm multipart gap'
    '920121-6': 'Multipart FILES; filename with backslash — wasm multipart gap'
    '920121-7': 'Multipart FILES_NAMES; field name with backslash — wasm multipart gap'
    # Protocol encoding: Envoy/http codec may still reject or alter %00 / high-bytes
    # in :path despite normalize_path=false.
    '920230-1': 'Multiple URL encoding in query; residual Envoy/codec decode'
    '920271-1': 'Non-printable in query (%127); Envoy may drop/alter before wasm'
    '920271-2': 'Non-printable in query (%03); Envoy may drop/alter before wasm'
    '920271-3': 'Null byte in query name (%00); Envoy rejects/strips'
    '920271-4': 'Non-printable in Cookie (%13); header sanitization'
    '920272-1': 'Strict byte range on lone % after decode'
    '920272-2': 'Strict byte range on %80 high-byte'
    '920272-3': 'Strict byte range on %FF in query'
    '920272-5': 'Strict byte range on %FF in path'
    '920273-1': 'PL4 very strict byte range on %20 space'
    '920273-3': 'PL4 very strict byte range on body <'
    '920273-5': 'PL4 very strict byte range on %60 backtick'
    # Phase-5 SecAction 980170: processLogging runs but CRS skipAfter/LOG-REPORTING
    # path does not append 980170 to m_rulesMessages under libModSecurity+wasm yet.
    '980170-1': 'Phase-5 correlation SecAction not emitted (processLogging runs; id missing)'
    '980170-2': 'Phase-5 correlation SecAction not emitted (processLogging runs; id missing)'
    '980170-3': 'Phase-5 correlation negative case; paired with 980170-1/2 gap'
    '949110-4': 'Related to 920100. Invalid HTTP method rejected by Envoy'

    # modsecurity-proxy-wasm crafts Host from :authority (same as coraza-proxy-wasm).
    '920280-1': 'Rule 920280 matches missing Host; plugin crafts it from :authority'
    '920280-3': 'Rule 920280 matches missing Host; plugin crafts it from :authority'
    '920290-1': 'Rule 920290 matches empty Host; plugin crafts it from :authority'

    # Tests with log_contains disabled in CRS but rule still fires.
    '920270-4': 'Log contains 920270. Test has log_contains disabled.'

    # Known engine / proxy-wasm gaps (track and shrink over time).
    '920171-2': 'Rule 920171 not detected. GET/HEAD with body.'
    '920171-3': 'Rule 920171 not detected. GET/HEAD with body.'
    '920430-3': 'Rule 920430 not detected. Proto version.'
    '920430-8': 'Rule 920430 not detected. Proto version.'
    '920430-9': 'Rule 920430 not detected. Proto version.'
    '934120-23': 'Rule 934120 partial. HTTP/1.1 400 or HTTP/2 enclosed alphanumerics.'
    '934120-24': 'Rule 934120 partial. HTTP/1.1 400 or HTTP/2 enclosed alphanumerics.'
    '934120-25': 'Rule 934120 partial. HTTP/1.1 400 or HTTP/2 enclosed alphanumerics.'
    '934120-26': 'Rule 934120 partial. HTTP/1.1 400 or HTTP/2 enclosed alphanumerics.'
    '934120-39': 'Rule 934120 partial. HTTP/1.1 400 or HTTP/2 enclosed alphanumerics.'
    '932200-13': 'Unfortunate match inside logs against a different rule log.'
    '920274-1': 'Host validation. Apache expects status 400.'
    '920430-5': 'Empty HTTP version; go-ftw premature EOF / Envoy rejects before wasm'
    '921140-1': 'Expected HTTP 400 for CR in header; Envoy/WAF interaction'
