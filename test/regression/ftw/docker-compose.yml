services:
  albedo:
    # renovate: datasource=docker depName=ghcr.io/coreruleset/albedo
    image: ghcr.io/coreruleset/albedo:0.3.0
    command: ["--json"]

  chown:
    # renovate: datasource=docker depName=alpine
    image: alpine:3.20
    command:
      - /bin/sh
      - -c
      - touch /home/envoy/logs/envoy.log && chown -R 101:101 /home/envoy/logs
    volumes:
      - logs:/home/envoy/logs:rw

  envoy:
    depends_on:
      - chown
      - albedo
    image: ${ENVOY_IMAGE:-envoyproxy/envoy:v1.39-latest@sha256:d59f7f5fa10cff6d5892b6c5e7df5c9297ddfb2c3683e33fbfb82da24de4fa66}
    # Do not use --log-path: Envoy buffers file logs (~8s lag), so go-ftw markers
    # need 300ms×40 retries. Line-buffered tee makes markers appear in ~ms.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # Short format: free budget under Envoy's ~512-char wasm log line limit so
        # go-ftw can still see JSON "id":N and X-CRS-Test marker values in msg/data.
        # wasm:info (not debug): avoid flooding marker scans.
        exec stdbuf -oL -eL envoy -c /etc/envoy.yaml \
          --log-level info \
          --component-log-level wasm:info \
          --log-format '[%Y-%m-%d %T.%f][%t][%l][%n] %v' \
          2>&1 | stdbuf -oL tee -a /home/envoy/logs/envoy.log
    volumes:
      - ${MODSECURITY_PROXY_WASM:-../../../dist/modsecurity-proxy-wasm.wasm}:/etc/modsecurity-proxy-wasm.wasm:ro
      # Path B: generated by run-ftw.sh (gzip CRS + @ftw-conf). Falls back to static envoy.yaml.
      - ${FTW_ENVOY_YAML:-./envoy.yaml}:/etc/envoy.yaml:ro
      - logs:/home/envoy/logs:rw
    ports:
      - "${FTW_HOST_PORT:-18082}:8080"

  ftw:
    depends_on:
      - envoy
    image: ghcr.io/coreruleset/go-ftw:${GO_FTW_VERSION:-2.4.0}
    working_dir: /workspace
    entrypoint: ["sh", "/workspace/tests.sh"]
    environment:
      - FTW_CLOUDMODE=${FTW_CLOUDMODE:-false}
      - FTW_INCLUDE=${FTW_INCLUDE:-}
      - FTW_RATE_LIMIT=${FTW_RATE_LIMIT:-50ms}
      - FTW_MAX_MARKER_RETRIES=${FTW_MAX_MARKER_RETRIES:-40}
      - FTW_MARKER_SETTLE=${FTW_MARKER_SETTLE:-1}
      - FTW_READ_TIMEOUT=${FTW_READ_TIMEOUT:-5s}
    volumes:
      - logs:/home/envoy/logs:ro
      - ./tests.sh:/workspace/tests.sh:ro
      - ./ftw.yml:/workspace/ftw.yml:ro
      - ${CRS_CACHE:-./.crs-cache}:/workspace/coreruleset:ro

volumes:
  logs:
