name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y git

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OCI image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ github.ref_name }}
          # Makefile prefers podman when both are installed; GH Actions runners
          # have both, so pin docker for build/push/extract consistency.
          CTR: docker
        run: |
          VERSION="${TAG#v}"
          make image IMAGE="${IMAGE}:${TAG}" VERSION="${VERSION}"
          docker push "${IMAGE}:${TAG}"
          docker tag "${IMAGE}:${TAG}" "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:${VERSION}"
          echo "Pushed ${IMAGE}:${TAG} and ${IMAGE}:${VERSION}"

      - name: Extract modsec.wasm
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          CTR: docker
        run: |
          make extract-wasm IMAGE="${IMAGE}"
          sha256sum dist/modsec.wasm | awk '{print $1}' > dist/modsec.wasm.sha256
          echo "modsec.wasm sha256: $(cat dist/modsec.wasm.sha256)"

      - name: Upload modsec.wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: modsec-wasm
          path: dist/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download modsec.wasm
        uses: actions/download-artifact@v4
        with:
          name: modsec-wasm
          path: dist

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl unzip python3 python3-matplotlib

      - name: Run performance benchmarks and render overlay chart
        run: make test-perf-release ENVOY_IMAGE=envoyproxy/envoy:v1.38-latest

      - name: Verify perf overlay chart
        run: test -f test/perf/release-charts/perf-overlay.png

      - name: Write release notes with perf chart embeds
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          chmod +x build/scripts/write-release-notes.sh
          ./build/scripts/write-release-notes.sh release-notes.md test/perf/release-charts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/modsec.wasm
            dist/modsec.wasm.sha256
            test/perf/release-charts/perf-overlay.png