name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y git

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OCI images (path-b default + full second-class)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ github.ref_name }}
          DOCKERFILE: build/docker/Dockerfile
          # Makefile prefers podman when both are installed; GH Actions runners
          # have both, so pin docker for build/push/extract consistency.
          CTR: docker
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # First-class: path-b (no embedded CRS rule confs). Tags match historical
          # :vX.Y.Z / :X.Y.Z so existing pins keep getting the tested default.
          echo "Building ${IMAGE}:${TAG} CATALOG_MODE=path-b"
          make image IMAGE="${IMAGE}:${TAG}" VERSION="${VERSION}" CATALOG_MODE=path-b
          docker push "${IMAGE}:${TAG}"
          docker tag "${IMAGE}:${TAG}" "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:${VERSION}"
          docker tag "${IMAGE}:${TAG}" "${IMAGE}:${TAG}-path-b"
          docker push "${IMAGE}:${TAG}-path-b"
          docker tag "${IMAGE}:${TAG}" "${IMAGE}:${VERSION}-path-b"
          docker push "${IMAGE}:${VERSION}-path-b"
          echo "Pushed path-b: ${IMAGE}:{${TAG},${VERSION},${TAG}-path-b,${VERSION}-path-b}"

          # Second-class: full catalog for Path A (crsEnable / Include @owasp_crs).
          # Not CI e2e-gated in the operator monorepo; use when you need embedded CRS.
          echo "Building ${IMAGE}:${TAG}-full CATALOG_MODE=full"
          make image IMAGE="${IMAGE}:${TAG}-full" VERSION="${VERSION}" CATALOG_MODE=full
          docker push "${IMAGE}:${TAG}-full"
          docker tag "${IMAGE}:${TAG}-full" "${IMAGE}:${VERSION}-full"
          docker push "${IMAGE}:${VERSION}-full"
          echo "Pushed full: ${IMAGE}:{${TAG}-full,${VERSION}-full}"

      - name: Extract path-b and full wasm binaries
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ github.ref_name }}
          CTR: docker
        run: |
          set -euo pipefail
          make extract-wasm IMAGE="${IMAGE}:${TAG}"
          sha256sum dist/modsecurity-proxy-wasm.wasm | awk '{print $1}' > dist/modsecurity-proxy-wasm.wasm.sha256
          echo "path-b wasm sha256: $(cat dist/modsecurity-proxy-wasm.wasm.sha256)"
          # Extract full catalog into a distinct filename for the GitHub release.
          CTR=docker ./build/scripts/extract-wasm-from-image.sh "${IMAGE}:${TAG}-full" dist/full-tmp
          mv dist/full-tmp/modsecurity-proxy-wasm.wasm dist/modsecurity-proxy-wasm-full.wasm
          rm -rf dist/full-tmp
          sha256sum dist/modsecurity-proxy-wasm-full.wasm | awk '{print $1}' > dist/modsecurity-proxy-wasm-full.wasm.sha256
          echo "full wasm sha256: $(cat dist/modsecurity-proxy-wasm-full.wasm.sha256)"
          ls -la dist/*.wasm dist/*.sha256

      - name: Upload modsecurity-proxy-wasm.wasm artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: modsecurity-proxy-wasm
          path: |
            dist/modsecurity-proxy-wasm.wasm
            dist/modsecurity-proxy-wasm.wasm.sha256
            dist/modsecurity-proxy-wasm-full.wasm
            dist/modsecurity-proxy-wasm-full.wasm.sha256
            dist/waf-config.default.json
            dist/envoy.example.yaml
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download modsecurity-proxy-wasm.wasm
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: modsecurity-proxy-wasm
          path: dist

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl unzip python3 python3-matplotlib

      - name: Run performance benchmarks and render overlay chart
        env:
          # fetch-release-wasm.sh needs this for private-repo previous-release assets
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: make test-perf-release ENVOY_IMAGE=envoyproxy/envoy:v1.39.0

      - name: Verify perf charts
        run: |
          test -f test/perf/release-charts/perf-overlay.png
          test -f test/perf/release-charts/memory-overlay.png
          if [[ -f test/perf/results/release-compare.json ]]; then
            test -f test/perf/release-charts/perf-release-compare.png
          fi

      - name: Conventional commit changelog since last release
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: COMMIT
          toTag: ${{ github.ref_name }}
          outputFile: conventional-changelog.md
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}",
              "categories": [
                { "title": "## 🚀 Features", "labels": ["feat", "feature"] },
                { "title": "## 🐛 Bug Fixes", "labels": ["fix", "bug"] },
                { "title": "## 📚 Documentation", "labels": ["docs"] },
                { "title": "## ⚡ Performance", "labels": ["perf"] },
                { "title": "## 🔧 Refactoring", "labels": ["refactor"] },
                { "title": "## ✅ Tests", "labels": ["test"] },
                { "title": "## 🏗 Build", "labels": ["build"] },
                { "title": "## 🔁 CI", "labels": ["ci"] },
                { "title": "## 📦 Other", "labels": ["chore", "revert", "style"] }
              ],
              "label_extractor": [
                {
                  "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test){1}(\\([\\w\\-\\.]+\\))?(!)?: ([\\w ])+([\\s\\S]*)",
                  "on_property": "title",
                  "target": "$1"
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write release notes with perf chart embeds
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          chmod +x build/scripts/write-release-notes.sh
          ./build/scripts/write-release-notes.sh release-notes.md test/perf/release-charts conventional-changelog.md
          echo "Changelog range: ${{ steps.changelog.outputs.fromTag }} -> ${{ steps.changelog.outputs.toTag }} (${{ steps.changelog.outputs.commits }} commits)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/modsecurity-proxy-wasm.wasm
            dist/modsecurity-proxy-wasm.wasm.sha256
            dist/modsecurity-proxy-wasm-full.wasm
            dist/modsecurity-proxy-wasm-full.wasm.sha256
            test/perf/release-charts/*.png