name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl unzip python3 python3-matplotlib

      - name: Build OCI image and extract modsec.wasm
        run: |
          make image IMAGE=modsec-wasm:release
          make extract-wasm IMAGE=modsec-wasm:release
          sha256sum dist/modsec.wasm | awk '{print $1}' > dist/modsec.wasm.sha256
          echo "modsec.wasm sha256: $(cat dist/modsec.wasm.sha256)"

      - name: Run performance benchmarks and render PNG charts
        run: make test-perf-release ENVOY_IMAGE=envoyproxy/envoy:v1.38-latest

      - name: Write release notes with perf chart embeds
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          chmod +x build/scripts/write-release-notes.sh
          ./build/scripts/write-release-notes.sh release-notes.md test/perf/release-charts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/modsec.wasm
            dist/modsec.wasm.sha256
            test/perf/release-charts/*.png