name: test

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y git g++
      - name: Unit tests (gtest)
        run: make deps-test test-unit

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: getentropy policy check
        run: make verify-getentropy-stub

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git g++ curl wabt
      - name: Build wasm image
        run: make image IMAGE=modsec-wasm:ci
      - name: Extract modsec.wasm
        run: make extract-wasm IMAGE=modsec-wasm:ci
      - name: Bats integration tests
        run: make test-bats ENVOY_IMAGE=envoyproxy/envoy:v1.38-latest

  ftw-subset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git g++ curl wabt
      - name: Build wasm image
        run: make image IMAGE=modsec-wasm:ci
      - name: Extract modsec.wasm
        run: make extract-wasm IMAGE=modsec-wasm:ci
      - name: CRS go-ftw subset (XSS rules)
        run: make test-regression FTW_INCLUDE='^941.*' ENVOY_IMAGE=envoyproxy/envoy:v1.38-latest

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y git clang wabt
      - name: libFuzzer smoke
        run: make deps-test test-fuzz

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl unzip python3 python3-matplotlib
      - name: Build wasm image
        run: make image IMAGE=modsec-wasm:ci
      - name: Extract modsec.wasm
        run: make extract-wasm IMAGE=modsec-wasm:ci
      - name: k6 performance smoke (baseline + modsec/coraza pairs)
        run: make test-perf-k6-ci ENVOY_IMAGE=envoyproxy/envoy:v1.38-latest
      - name: Render perf PNG charts
        if: always()
        run: make test-perf-charts
      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: |
            test/perf/results/**/k6-report.html
            test/perf/results/**/k6-compare.html
            test/perf/results/**/k6-report.png
            test/perf/results/**/k6-compare.png
            test/perf/results/**/k6-summary.json
            test/perf/results/**/k6-stdout.txt
            test/perf/release-charts/*.png
          retention-days: 14
          if-no-files-found: ignore